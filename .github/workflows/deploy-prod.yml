name: Deploy SyncQuote API Prod

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write              # GHCR 푸시용

concurrency:
  group: syncquote-api-prod
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: syncquote-was
  K8S_NAMESPACE: default
  K8S_DEPLOYMENT: api-server
  K8S_CONTAINER: api-server

jobs:
  test:
    name: Test Spring API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Run tests
        run: ./gradlew test --no-daemon

  build-and-push:
    name: Build and Push Prod Image
    runs-on: ubuntu-latest
    needs: test

    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: image
        run: |
          IMAGE="${REGISTRY}/${{ github.repository_owner }}/${IMAGE_NAME}"
          IMAGE="${IMAGE,,}"          # GHCR은 소유자명 소문자 요구
          echo "image=${IMAGE}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_SHA=${IMAGE}:${{ github.sha }}" >> "$GITHUB_ENV"
          echo "IMAGE_LATEST=${IMAGE}:latest" >> "$GITHUB_ENV"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_SHA }}
            ${{ env.IMAGE_LATEST }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Kubernetes
    # self-hosted runner + 클러스터가 준비됐을 때만 실행.
    # repo 변수 DEPLOY_ENABLED=true 설정 시 동작. 미설정이면 이 잡은 'skipped' →
    # test/build-and-push까지만 완료되어 GHCR 푸시는 정상, 무기한 Pending·실패 Deployment 방지.
    # (runner 없으면 이 잡이 큐에 멈추고 concurrency가 다음 push의 빌드까지 막아 'Build 안 됨'을 유발했음)
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: [self-hosted, linux, x64]
    needs: build-and-push
    environment: production

    steps:
      - name: Check Kubernetes access
        run: |
          command -v kubectl
          kubectl config current-context
          kubectl -n "$K8S_NAMESPACE" get deployment/"$K8S_DEPLOYMENT"

      - name: Update API deployment image
        run: |
          kubectl -n "$K8S_NAMESPACE" set image \
            deployment/"$K8S_DEPLOYMENT" \
            "$K8S_CONTAINER"="${{ needs.build-and-push.outputs.image }}"

      - name: Wait for rollout
        run: |
          kubectl -n "$K8S_NAMESPACE" rollout status \
            deployment/"$K8S_DEPLOYMENT" \
            --timeout=180s
