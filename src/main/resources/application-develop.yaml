spring:
  config:
    activate:
      on-profile: develop
  docker:
    compose:
      enabled: true
      file: compose.yaml
  datasource:
    url: jdbc:mysql://localhost:3306/syncquote?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:syncquote}
    password: ${DB_PASSWORD:syncquote}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
