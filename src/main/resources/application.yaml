spring:
  application:
    name: syncquote-api
  profiles:
    default: develop
    group:
      api: prod
  jackson:
    property-naming-strategy: SNAKE_CASE

mybatis:
  mapper-locations: classpath:/mappers/**/*.xml
  type-aliases-package: com.syncquote
  configuration:
    map-underscore-to-camel-case: true
