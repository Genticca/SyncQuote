name: SyncQuote CI/CD Pipeline

# 1. 언제 이 자동화 파이프라인을 실행할 것인가?
on:
  push:
    branches: [ "main" ] # main 브랜치에 코드가 push되거나 merge되었을 때 실행

jobs:
  build-and-push:
    # 깃허브가 제공하는 가상의 우분투 리눅스 컴퓨터에서 실행
    runs-on: ubuntu-latest

    steps:
    # [Step 1] 깃허브 리포지토리에 있는 우리 소스 코드를 가상 컴퓨터로 다운로드
    - name: Checkout source code
      uses: actions/checkout@v4

    # [Step 2] 자바 21 환경 세팅 (팀원분 Dockerfile 스펙과 동기화)
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle' # 그래들 빌드 속도를 비약적으로 높이기 위해 캐싱 활성화

    # [Step 3] 그래들 빌드 실행 권한(Execute) 부여
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # [Step 4] 도커 환경이 없는 가상 컴퓨터이므로, 테스트를 제외하고 pure하게 JAR 파일 빌드
    - name: Build with Gradle
      run: ./gradlew clean bootJar -x test --no-daemon

    # [Step 5] 도커 허브(Docker Hub)에 로그인
    # 보안을 위해 비밀번호와 아이디는 깃허브 비밀함(Secrets)에서 꺼내옵니다.
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # [Step 6] 도커 이미지 빌드 및 도커 허브에 자동 업로드(Push)
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        # 내 도커허브 계정명/레포이름 형태로 태그를 매겨 업로드합니다.
        # 최신본을 뜻하는 latest와, 추적이 가능하도록 깃허브 커밋 고유 해시값(sha)을 동시에 부여합니다.
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/syncquote-was:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/syncquote-was:${{ github.sha }}